<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 02 - listaCidadesAPartirDeEstados</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 40px;
        }
        h1 {
            font-size: 24px;
        }
        .container {
            max-width: 500px;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            background-color: white;
        }
        select:disabled {
            background-color: #e9ecef;
            color: #6c757d;
            cursor: not-allowed;
        }
        #resultado {
            margin-top: 25px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>listaCidadesAPartirDeEstados</h1>

        <label for="selectEstado">Estado:</label>
        <select id="selectEstado">
            <option value="">Carregando estados...</option>
        </select>

        <label for="selectCidade">Cidade:</label>
        <select id="selectCidade" disabled>
            <option value="">Selecione um estado primeiro</option>
        </select>

        <p id="resultado"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
